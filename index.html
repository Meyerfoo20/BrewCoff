<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrewCoff</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        :root {
        --bg-main: #f8f6f0;
        --bg-alt: #eee8dc;
        --bg-card: #ffffff;
        --bg-glass: rgba(248, 246, 240, 0.82);
        --text-main: #181c19;
        --text-muted: #56615a;
        --border-color: #ded8cb;
        --shadow-elevated: 0 12px 32px rgba(0, 0, 0, 0.05), 0 2px 6px rgba(0, 0, 0, 0.02);
        --btn-text: #ffffff;
        --bg-footer: #211612;
        --accent-main: #3b2720;
        --accent-hover: #54382e;
        --accent-light: #eee5e0;
        --accent-pop: #d97706;
        --radius-sm: 8px;
        --radius-md: 16px;
        --radius-lg: 24px;
        --transition-smooth: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        background-color: var(--bg-main);
        color: var(--text-main);
        line-height: 1.6;
        overflow-x: hidden;
    }

    h1, h2, h3, .font-serif {
        font-family: 'Playfair Display', serif;
    }
    </style>
</head>
<body>

    <div class="top-bar">
        ☕ Fri frakt vid beställningar över 299 kr | Snabb leverans 1-3 vardagar
    </div>

    <!-- Navbar Rasmus -->
    <nav class="navbar">
        
    </nav>

    <!-- Huvudinnehåll Rasmus -->
    <div id="mainView">
        <!-- Hero -->
        <section class="hero">
            
        </section>

        <!-- Produkt Neo -->
        <section id="produkter" class="catalog-header">
            <div class="filter-pills">
                <button class="filter-pill active" onclick="filterCategory('all', this)">Alla</button>
                <button class="filter-pill" onclick="filterCategory('motiv', this)">Muggar</button>
                <button class="filter-pill" onclick="filterCategory('filter', this)">Kaffefilter</button>
            </div>
            <div class="search-box">
                <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                <input type="text" placeholder="Sök mugg eller filter..." onkeyup="searchProducts(this.value)">
            </div>
        </section>

        <!-- Product Grid -->
        <section class="products-grid" id="productContainer">
        </section>

        <!-- Custom Mugg Jakob -->
        <section id="studio" class="custom-studio-section">

        </section>
    </div>

    <!-- Intern Produktsida Rör ej -->
    <div id="productDetailView" class="product-detail-view" style="display: none;">
        <div class="product-detail-container">
            <button class="back-btn" onclick="showMainView()">
                &larr; Tillbaka till produkter
            </button>
            <div class="product-detail-grid">
                <div class="product-detail-img-box">
                    <img id="detailImg" src="" alt="">
                </div>
                <div class="product-detail-info">
                    <span id="detailBadge" class="product-badge" style="position: static; display: inline-block; margin-bottom: 12px;"></span>
                    <h1 id="detailTitle"></h1>
                    <p id="detailPrice" class="product-price" style="font-size: 1.8rem; margin: 16px 0;"></p>
                    <p id="detailDesc" style="color: var(--text-muted); margin-bottom: 24px; font-size: 1.05rem;"></p>
                    
                    <div class="detail-actions">
                        <button class="btn-primary" id="detailAddToCartBtn" style="padding: 14px 32px; font-size: 1rem;">Lägg till i varukorg</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Varukorg Anton Gren -->
    <div class="cart-overlay" id="cartOverlay" onclick="toggleCart()"></div>
    <div class="cart-drawer" id="cartDrawer">

    </div>


    <!-- Footer Anton Blad -->
    <footer>

    </footer>

    <!-- JavaScript -->
    <script src="script.js"></script>
</body>
</html>
