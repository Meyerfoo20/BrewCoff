<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrewCoff</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        :root {
        --bg-main: #f8f6f0;
        --bg-alt: #eee8dc;
        --bg-card: #ffffff;
        --bg-glass: rgba(248, 246, 240, 0.82);
        --text-main: #181c19;
        --text-muted: #56615a;
        --border-color: #ded8cb;
        --shadow-elevated: 0 12px 32px rgba(0, 0, 0, 0.05), 0 2px 6px rgba(0, 0, 0, 0.02);
        --btn-text: #ffffff;
        --bg-footer: #211612;
        --accent-main: #3b2720;
        --accent-hover: #54382e;
        --accent-light: #eee5e0;
        --accent-pop: #d97706;
        --radius-sm: 8px;
        --radius-md: 16px;
        --radius-lg: 24px;
        --transition-smooth: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        background-color: var(--bg-main);
        color: var(--text-main);
        line-height: 1.6;
        overflow-x: hidden;
    }

    h1, h2, h3, .font-serif {
        font-family: 'Playfair Display', serif;
    }

        /* ===== Varukorg Anton Gren ===== */
        .cart-overlay {
            position: fixed;
            inset: 0;
            background: rgba(24, 28, 25, 0.45);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 998;
        }
        .cart-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        .cart-drawer {
            position: fixed;
            top: 0;
            right: 0;
            height: 100%;
            width: 400px;
            max-width: 92vw;
            background: var(--bg-card);
            z-index: 999;
            display: flex;
            flex-direction: column;
            transform: translateX(105%);
            transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: -12px 0 40px rgba(0, 0, 0, 0.12);
        }
        .cart-drawer.open {
            transform: translateX(0);
        }

        .cart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 24px;
            border-bottom: 1px solid var(--border-color);
        }
        .cart-title {
            font-size: 1.4rem;
            font-weight: 700;
        }
        .cart-close-btn {
            background: none;
            border: none;
            font-size: 1.6rem;
            line-height: 1;
            cursor: pointer;
            color: var(--text-muted);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            transition: var(--transition-smooth);
        }
        .cart-close-btn:hover {
            background: var(--accent-light);
            color: var(--accent-main);
        }

        .cart-items {
            flex: 1;
            overflow-y: auto;
            padding: 8px 24px;
        }

        .cart-empty {
            text-align: center;
            padding: 48px 0;
            color: var(--text-muted);
        }
        .cart-empty-icon {
            font-size: 3rem;
            margin-bottom: 12px;
        }
        .cart-continue-btn {
            margin-top: 16px;
            background: var(--accent-main);
            color: var(--btn-text);
            border: none;
            padding: 10px 22px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: var(--transition-smooth);
        }
        .cart-continue-btn:hover {
            background: var(--accent-hover);
        }

        .cart-item {
            display: flex;
            gap: 14px;
            padding: 16px 0;
            border-bottom: 1px solid var(--border-color);
            align-items: flex-start;
        }
        .cart-item-img {
            width: 64px;
            height: 64px;
            border-radius: var(--radius-sm);
            overflow: hidden;
            background: var(--bg-alt);
            flex-shrink: 0;
        }
        .cart-item-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .cart-item-info {
            flex: 1;
            min-width: 0;
        }
        .cart-item-name {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 2px;
        }
        .cart-item-desc {
            font-size: 0.78rem;
            color: var(--text-muted);
            margin-bottom: 2px;
        }
        .cart-item-price {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 8px;
        }
        .cart-item-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .qty-stepper {
            display: flex;
            align-items: center;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            overflow: hidden;
        }
        .qty-stepper button {
            background: none;
            border: none;
            width: 28px;
            height: 28px;
            cursor: pointer;
            font-size: 1rem;
            color: var(--accent-main);
            transition: var(--transition-smooth);
        }
        .qty-stepper button:hover {
            background: var(--accent-light);
        }
        .qty-value {
            min-width: 28px;
            text-align: center;
            font-size: 0.9rem;
            font-weight: 600;
        }
        .cart-remove-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 0.78rem;
            cursor: pointer;
            text-decoration: underline;
            padding: 4px;
            transition: var(--transition-smooth);
        }
        .cart-remove-btn:hover {
            color: var(--accent-main);
        }
        .cart-item-line-total {
            font-size: 0.9rem;
            font-weight: 700;
            white-space: nowrap;
        }

        .cart-footer {
            padding: 16px 24px 24px;
            border-top: 1px solid var(--border-color);
            background: var(--bg-main);
        }
        .cart-shipping-note {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 6px;
        }
        .cart-progress-track {
            height: 6px;
            background: var(--bg-alt);
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 14px;
        }
        .cart-progress-fill {
            height: 100%;
            width: 0;
            background: var(--accent-pop);
            border-radius: 3px;
            transition: width 0.4s ease;
        }
        .cart-total-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 6px;
        }
        .cart-total-row .free {
            color: #15803d;
            font-weight: 600;
        }
        .cart-grand-total {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text-main);
            margin: 10px 0 14px;
        }
        .cart-checkout-btn {
            width: 100%;
            padding: 14px;
            background: var(--accent-main);
            color: var(--btn-text);
            border: none;
            border-radius: var(--radius-sm);
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition-smooth);
        }
        .cart-checkout-btn:hover {
            background: var(--accent-hover);
        }

        /* Flytande varukorgsknapp */
        .cart-fab {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 997;
            width: 58px;
            height: 58px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            background: var(--accent-main);
            color: var(--btn-text);
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition-smooth);
        }
        .cart-fab:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
        }
        .cart-fab svg {
            width: 24px;
            height: 24px;
        }
        .cart-count {
            position: absolute;
            top: -4px;
            right: -4px;
            min-width: 22px;
            height: 22px;
            background: var(--accent-pop);
            color: #fff;
            border-radius: 11px;
            font-size: 0.72rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 6px;
        }

        /* Toast-notis */
        .cart-toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--accent-main);
            color: var(--btn-text);
            padding: 12px 20px;
            border-radius: 24px;
            font-size: 0.9rem;
            font-weight: 500;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            max-width: 90vw;
            text-align: center;
        }
        .cart-toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        @media (max-width: 480px) {
            .cart-drawer {
                width: 100vw;
                max-width: 100vw;
            }
            .cart-fab {
                bottom: 16px;
                right: 16px;
            }
        }
    </style>
</head>
<body>

    <div class="top-bar">
        ☕ Fri frakt vid beställningar över 299 kr | Snabb leverans 1-3 vardagar
    </div>

    <!-- Navbar Rasmus -->
    <nav class="navbar">

    </nav>

    <!-- Huvudinnehåll Rasmus -->
    <div id="mainView">
        <!-- Hero -->
        <section class="hero">

        </section>

        <!-- Produkt Neo -->
        <section id="produkter" class="catalog-header">
            <div class="filter-pills">
                <button class="filter-pill active" onclick="filterCategory('all', this)">Alla</button>
                <button class="filter-pill" onclick="filterCategory('motiv', this)">Muggar</button>
                <button class="filter-pill" onclick="filterCategory('filter', this)">Kaffefilter</button>
            </div>
            <div class="search-box">
                <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                <input type="text" placeholder="Sök mugg eller filter..." onkeyup="searchProducts(this.value)">
            </div>
        </section>

        <!-- Product Grid -->
        <section class="products-grid" id="productContainer">
        </section>

        <!-- Custom Mugg Jakob -->
        <section id="studio" class="custom-studio-section">

        </section>
    </div>

    <!-- Intern Produktsida Rör ej -->
    <div id="productDetailView" class="product-detail-view" style="display: none;">
        <div class="product-detail-container">
            <button class="back-btn" onclick="showMainView()">
                &larr; Tillbaka till produkter
            </button>
            <div class="product-detail-grid">
                <div class="product-detail-img-box">
                    <img id="detailImg" src="" alt="">
                </div>
                <div class="product-detail-info">
                    <span id="detailBadge" class="product-badge" style="position: static; display: inline-block; margin-bottom: 12px;"></span>
                    <h1 id="detailTitle"></h1>
                    <p id="detailPrice" class="product-price" style="font-size: 1.8rem; margin: 16px 0;"></p>
                    <p id="detailDesc" style="color: var(--text-muted); margin-bottom: 24px; font-size: 1.05rem;"></p>

                    <div class="detail-actions">
                        <button class="btn-primary" id="detailAddToCartBtn" style="padding: 14px 32px; font-size: 1rem;">Lägg till i varukorg</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Varukorg Anton Gren -->
    <div class="cart-overlay" id="cartOverlay" onclick="toggleCart()"></div>
    <div class="cart-drawer" id="cartDrawer" role="dialog" aria-modal="true" aria-label="Varukorg">
        <div class="cart-header">
            <h2 class="cart-title">Varukorg</h2>
            <button class="cart-close-btn" onclick="toggleCart()" aria-label="Stäng varukorgen">&times;</button>
        </div>

        <div class="cart-items" id="cartItems"></div>

        <div class="cart-footer" id="cartFooter">
            <p class="cart-shipping-note" id="shippingNote"></p>
            <div class="cart-progress-track">
                <div class="cart-progress-fill" id="shippingProgress"></div>
            </div>
            <div class="cart-total-row">
                <span>Subtotal</span>
                <span id="cartSubtotal">0 kr</span>
            </div>
            <div class="cart-total-row">
                <span>Frakt</span>
                <span id="cartShipping">–</span>
            </div>
            <div class="cart-total-row cart-grand-total">
                <span>Totalt</span>
                <span id="cartTotal">0 kr</span>
            </div>
            <button class="cart-checkout-btn" onclick="checkout()">Till kassan</button>
        </div>
    </div>

    <!-- Flytande varukorgsknapp -->
    <button class="cart-fab" onclick="toggleCart()" aria-label="Öppna varukorgen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="9" cy="21" r="1"></circle>
            <circle cx="20" cy="21" r="1"></circle>
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
        </svg>
        <span class="cart-count" id="cartCount" style="display:none;">0</span>
    </button>

    <!-- Footer Anton Blad -->
    <footer>

    </footer>

    <!-- JavaScript -->
    <script src="script.js"></script>

    <!-- JavaScript Varukorg Anton Gren -->
    <script>
        const FREE_SHIPPING_LIMIT = 299; // Fri frakt över 299 kr (enligt toppbaren)
        const SHIPPING_COST = 49;
        const CART_STORAGE_KEY = 'brewcoff_cart';
        let cartToastTimer = null;

        // ===== Lagring (localStorage) =====
        function saveCartToStorage() {
            try {
                localStorage.setItem(CART_STORAGE_KEY, JSON.stringify(cart));
            } catch (e) { /* localStorage inte tillgängligt */ }
        }

        function loadCartFromStorage() {
            try {
                const raw = localStorage.getItem(CART_STORAGE_KEY);
                if (!raw) return;
                const saved = JSON.parse(raw);
                if (!Array.isArray(saved)) return;
                cart.length = 0;
                saved.forEach(item => {
                    const product = products.find(p => p.id === item.id);
                    if (product && item.qty > 0) {
                        cart.push({
                            id: product.id,
                            name: product.name,
                            category: product.category,
                            price: product.price,
                            desc: product.desc,
                            image: product.image,
                            qty: item.qty
                        });
                    }
                });
            } catch (e) { /* trasig sparad varukorg -> ignorera */ }
        }

        // ===== Lägg till / ändra / ta bort =====
        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            if (!product) return;

            const existing = cart.find(item => item.id === productId);
            if (existing) {
                existing.qty += 1;
            } else {
                cart.push({
                    id: product.id,
                    name: product.name,
                    category: product.category,
                    price: product.price,
                    desc: product.desc,
                    image: product.image,
                    qty: 1
                });
            }
            saveCartToStorage();
            renderCart();
            showToast(product.name + " lades i varukorgen");
        }

        function changeQty(productId, delta) {
            const item = cart.find(i => i.id === productId);
            if (!item) return;
            item.qty += delta;
            if (item.qty <= 0) {
                removeFromCart(productId);
            } else {
                saveCartToStorage();
                renderCart();
            }
        }

        function removeFromCart(productId) {
            const index = cart.findIndex(i => i.id === productId);
            if (index === -1) return;
            cart.splice(index, 1);
            saveCartToStorage();
            renderCart();
        }

        // ===== Beräkningar =====
        function cartSubtotal() {
            return cart.reduce((sum, item) => sum + item.price * item.qty, 0);
        }

        function cartTotalQty() {
            return cart.reduce((sum, item) => sum + item.qty, 0);
        }

        function shippingCost() {
            if (cart.length === 0) return 0;
            return cartSubtotal() >= FREE_SHIPPING_LIMIT ? 0 : SHIPPING_COST;
        }

        function formatKr(amount) {
            return amount.toLocaleString('sv-SE') + ' kr';
        }

        // ===== Rendering =====
        function renderCart() {
            const itemsEl = document.getElementById('cartItems');
            const footerEl = document.getElementById('cartFooter');
            const countEl = document.getElementById('cartCount');
            if (!itemsEl) return;

            // Antal-badge på varukorgsknappen
            const totalQty = cartTotalQty();
            if (countEl) {
                countEl.textContent = totalQty;
                countEl.style.display = totalQty > 0 ? 'flex' : 'none';
            }

            // Tom varukorg
            if (cart.length === 0) {
                itemsEl.innerHTML = `
                    <div class="cart-empty">
                        <div class="cart-empty-icon">☕</div>
                        <p>Din varukorg är tom.</p>
                        <button class="cart-continue-btn" onclick="toggleCart()">Fortsätt handla</button>
                    </div>`;
                footerEl.style.display = 'none';
                return;
            }

            footerEl.style.display = 'block';

            itemsEl.innerHTML = cart.map(item => `
                <div class="cart-item">
                    <div class="cart-item-img">
                        <img src="${item.image}" alt="${item.name}">
                    </div>
                    <div class="cart-item-info">
                        <h4 class="cart-item-name">${item.name}</h4>
                        ${item.desc ? `<p class="cart-item-desc">${item.desc}</p>` : ''}
                        <p class="cart-item-price">${formatKr(item.price)} / st</p>
                        <div class="cart-item-actions">
                            <div class="qty-stepper">
                                <button onclick="changeQty(${item.id}, -1)" aria-label="Minska antal">&minus;</button>
                                <span class="qty-value">${item.qty}</span>
                                <button onclick="changeQty(${item.id}, 1)" aria-label="Öka antal">+</button>
                            </div>
                            <button class="cart-remove-btn" onclick="removeFromCart(${item.id})">Ta bort</button>
                        </div>
                    </div>
                    <span class="cart-item-line-total">${formatKr(item.price * item.qty)}</span>
                </div>
            `).join('');

            // Totaler
            const subtotal = cartSubtotal();
            const shipping = shippingCost();
            document.getElementById('cartSubtotal').textContent = formatKr(subtotal);

            const shippingEl = document.getElementById('cartShipping');
            shippingEl.textContent = shipping === 0 ? 'Fri frakt' : formatKr(shipping);
            shippingEl.classList.toggle('free', shipping === 0);

            document.getElementById('cartTotal').textContent = formatKr(subtotal + shipping);

            // Frakt-progress
            const noteEl = document.getElementById('shippingNote');
            const barEl = document.getElementById('shippingProgress');
            if (subtotal >= FREE_SHIPPING_LIMIT) {
                noteEl.textContent = 'Du har kvalificerat dig för fri frakt!';
                barEl.style.width = '100%';
            } else {
                noteEl.textContent = 'Köp för ' + formatKr(FREE_SHIPPING_LIMIT - subtotal) + ' till för fri frakt';
                barEl.style.width = Math.min(100, (subtotal / FREE_SHIPPING_LIMIT) * 100) + '%';
            }
        }

        // ===== Öppna / stäng =====
        function toggleCart(forceOpen) {
            const drawer = document.getElementById('cartDrawer');
            const overlay = document.getElementById('cartOverlay');
            if (!drawer || !overlay) return;
            const willOpen = typeof forceOpen === 'boolean' ? forceOpen : !drawer.classList.contains('open');
            drawer.classList.toggle('open', willOpen);
            overlay.classList.toggle('open', willOpen);
            document.body.style.overflow = willOpen ? 'hidden' : '';
        }

        // Stäng med Esc
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                const drawer = document.getElementById('cartDrawer');
                if (drawer && drawer.classList.contains('open')) toggleCart(false);
            }
        });

        // ===== Kassa (demo) =====
        function checkout() {
            if (cart.length === 0) return;
            const total = cartSubtotal() + shippingCost();
            alert('Tack för din beställning!\n\nTotalt: ' + formatKr(total) +
                '\n\n(Detta är en demo – ingen betalning görs.)');
            cart.length = 0;
            saveCartToStorage();
            renderCart();
            toggleCart(false);
        }

        // ===== Toast-notis =====
        function showToast(message) {
            let toast = document.getElementById('cartToast');
            if (!toast) {
                toast = document.createElement('div');
                toast.id = 'cartToast';
                toast.className = 'cart-toast';
                document.body.appendChild(toast);
            }
            toast.textContent = message;
            toast.classList.add('show');
            clearTimeout(cartToastTimer);
            cartToastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
        }

        // ===== Init =====
        loadCartFromStorage();
        renderCart();
    </script>
</body>
</html>
